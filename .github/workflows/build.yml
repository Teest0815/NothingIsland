name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Signierschlüssel aus den Repository-Secrets KEYSTORE_BASE64 und KEYSTORE_PASSWORD.
      - name: Signierschlüssel einrichten
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f keystore/nothingisland.jks ]; then
            echo "Übergang: alter Schlüssel aus dem Repo wird verwendet."
          elif [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            if [ "${{ github.repository }}" = "Teest0815/NothingIsland" ]; then
              echo "::error::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD fehlen. Ohne festen Schlüssel ließe sich die APK nicht über die alte installieren."
              exit 1
            fi
            echo "Kein Schlüssel hinterlegt: Standard-Debug-Signatur (Fork)."
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NothingIsland-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Direkter Download ohne ZIP: Releases > "latest"
      - name: Publish APK as release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk NothingIsland.apk
          cp app/build/outputs/apk/debug/app-debug.apk "NothingIsland-v${VERSION}.apk"
          REPO="${GITHUB_REPOSITORY}"
          # Änderungen seit dem letzten Release: alle Commits zwischen dem vorherigen und diesem Stand.
          PREV="$(gh api "repos/${REPO}/releases/tags/latest" --jq .target_commitish 2>/dev/null || true)"
          if [ -n "$PREV" ] && git cat-file -e "${PREV}^{commit}" 2>/dev/null && [ "$PREV" != "$GITHUB_SHA" ]; then
            RANGE="${PREV}..${GITHUB_SHA}"
          else
            RANGE="-n 8 ${GITHUB_SHA}"
          fi
          CHANGES="$(git log --no-merges --pretty='- %s' $RANGE | grep -v -F '[skip ci]' | head -30 || true)"
          [ -z "$CHANGES" ] && CHANGES="- $(git log -1 --pretty=%s)"
          {
            echo "## Nothing Island v${VERSION}"
            echo
            echo "### Änderungen"
            echo "$CHANGES"
            echo
            echo "### Installieren"
            echo "\`NothingIsland.apk\` laden und über die alte App installieren. Die Einstellungen bleiben erhalten."
            echo
            echo "<sub>Build ${GITHUB_RUN_NUMBER} · Stand $(git rev-parse --short HEAD) · $(date -u +'%d.%m.%Y %H:%M') UTC</sub>"
          } > notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NothingIsland.apk "NothingIsland-v${VERSION}.apk" \
            --title "Nothing Island v${VERSION}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
