name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NothingIsland-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Direkter Download ohne ZIP: Releases > "latest"
      - name: Publish APK as release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NothingIsland.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NothingIsland.apk \
            --title "Nothing Island (latest)" \
            --notes "Automatisch gebaute Debug-APK vom letzten Push." \
            --target "$GITHUB_SHA"
