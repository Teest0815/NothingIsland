name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NothingIsland-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Direkter Download ohne ZIP: Releases > "latest"
      - name: Publish APK as release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk NothingIsland.apk
          cp app/build/outputs/apk/debug/app-debug.apk "NothingIsland-v${VERSION}.apk"
          MSG="$(git log -1 --pretty=%s)"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NothingIsland.apk "NothingIsland-v${VERSION}.apk" \
            --title "Nothing Island v${VERSION}" \
            --notes "Version ${VERSION} (Build ${GITHUB_RUN_NUMBER}) - ${MSG}" \
            --target "$GITHUB_SHA"
